name: Feature request
description: Suggest a feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Search [existing issues](https://github.com/gokcehan/lf/issues) before submitting.
  - type: textarea
    attributes:
      label: Problem or use case
      description: What is missing or difficult to do in lf?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired behavior
      description: Include an example of how you would use the feature.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Configuration and workarounds
      description: Have you tried implementing this in your `lfrc` or with external tools? If so, what limitations did you encounter?
    validations:
      required: true
