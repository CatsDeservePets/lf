name: Bug report
description: Report a problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        - Search [existing issues](https://github.com/gokcehan/lf/issues) before reporting.
        - Report only bugs you have verified yourself, including AI-generated findings.
  - type: textarea
    attributes:
      label: Description
      description: Describe what happened, including any error messages.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        Describe how to reproduce or verify the problem.
        Try reproducing it with `lf -config /dev/null` (Windows: `lf -config NUL`).
        If it only occurs with your configuration, include the relevant `lfrc` settings or scripts.
    validations:
      required: true
  - type: textarea
    attributes:
      label: lf version
      description: Paste the output of `lf -version`.
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include your operating system, terminal, shell, and any other details relevant to the issue.
      placeholder: |
        Operating system:
        Terminal:
        Shell:
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs and additional context
      description: Use `lf -log lf.log` to collect logs.
